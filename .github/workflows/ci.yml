name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Ensure private runtime is not tracked
        shell: pwsh
        run: |
          $forbidden = git ls-files | Where-Object { $_ -match '(^native-resources/|\.apk$|\.so$|\.private\.|\.log$|^test-results|^backups/)' }
          if ($forbidden) { throw 'Private runtime or diagnostics are tracked' }
